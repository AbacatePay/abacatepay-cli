version: 2

project_name: abacatepay

before:
  hooks:
    - go mod tidy

builds:
  - id: abacatepay
    main: ./cmd/abacatepay
    binary: abacatepay
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/AbacatePay/abacatepay-cli/internal/version.Version={{.Version}} -X github.com/AbacatePay/abacatepay-cli/internal/version.Commit={{.Commit}}

  # Alias (abkt)
  - id: abkt
    main: ./cmd/abacatepay
    binary: abkt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/AbacatePay/abacatepay-cli/internal/version.Version={{.Version}} -X github.com/AbacatePay/abacatepay-cli/internal/version.Commit={{.Commit}}

archives:
  - id: default
    ids:
      - abacatepay
      - abkt
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    wrap_in_directory: false
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# Homebrew (brew install --cask AbacatePay/tap/abacatepay)
homebrew_casks:
  - name: abacatepay
    binaries:
      - abacatepay
      - abkt
    repository:
      owner: AbacatePay
      name: homebrew-tap
      # secrets.GITHUB_TOKEN (this repo's default Actions token) can't push to a
      # different repo. See .github/workflows/release.yml for where this secret
      # must be configured.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://abacatepay.com
    description: AbacatePay’s developer-first CLI for APIs and local workflows

# Shell completions aren't wired up: cobra's built-in `completion` subcommand is
# disabled (CompletionOptions.DisableDefaultCmd in cmd/root.go), and goreleaser's
# schema has no top-level `completions:` key to pre-bake scripts into archives
# without it. Re-enable the cobra subcommand first if this is wanted later.
