version: 2

project_name: abacatepay

before:
  hooks:
    - go mod tidy

builds:
  - id: abacatepay
    main: ./cmd/abacatepay
    binary: abacatepay
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/AbacatePay/abacatepay-cli/internal/version.Version={{.Version}} -X github.com/AbacatePay/abacatepay-cli/internal/version.Commit={{.Commit}}

  # Alias (abkt)
  - id: abkt
    main: ./cmd/abacatepay
    binary: abkt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/AbacatePay/abacatepay-cli/internal/version.Version={{.Version}} -X github.com/AbacatePay/abacatepay-cli/internal/version.Commit={{.Commit}}

archives:
  - id: default
    ids:
      - abacatepay
      - abkt
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    wrap_in_directory: false
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# No Homebrew tap: install.sh (curl-to-shell, pulls straight from GitHub
# Releases) already covers "global install of the latest build" without
# needing a separate homebrew-tap repo or a cross-repo PAT to maintain.

# Shell completions aren't wired up: cobra's built-in `completion` subcommand is
# disabled (CompletionOptions.DisableDefaultCmd in cmd/root.go), and goreleaser's
# schema has no top-level `completions:` key to pre-bake scripts into archives
# without it. Re-enable the cobra subcommand first if this is wanted later.
