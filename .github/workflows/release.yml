name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # secrets.GITHUB_TOKEN is scoped to this repo only and cannot push the
          # generated Cask to AbacatePay/homebrew-tap. HOMEBREW_TAP_GITHUB_TOKEN
          # must be a PAT (or GitHub App token) with contents:write on that repo,
          # stored as a repo secret here. The homebrew_casks block in
          # .goreleaser.yaml picks it up via this env var name automatically.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
